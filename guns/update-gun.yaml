openapi: 3.0.2
info:
  title: "銃更新リクエスト"
  version: "1.0"
paths: {}
components:
  requestBodies:
    update:
      description: |-
        - 弾丸については置き換え
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/updateGunRequest"

  schemas:
    updateGunRequest:
      title: 銃更新リクエスト
      type: object
      properties:
        name:
          $ref: "./model.yaml#/components/schemas/gunName"
        category:
          $ref: "./model.yaml#/components/schemas/gunCategoryId"
        capacity:
          $ref: "./model.yaml#/components/schemas/gunCapacity"
        bullets:
          title: 弾丸ID
          type: array
          items:
            $ref: "../bullets/model.yaml#/components/schemas/bulletId"
