openapi: 3.0.2
info:
  title: "銃のモデル"
  version: "1.0"
paths: {}
components:
  schemas:
    gunId:
      title: 銃ID
      type: string
      pattern: '^G-\d{4}$'
      example: "G-0015"

    gunName:
      title: 銃名称
      type: string
      format: string
      minLength: 1
      maxLength: 20
      example: "Glock22"

    gunCapacity:
      title: 装弾数
      type: number
      format: int
      minimum: 1
      maximum: 5000
      example: 17

    gunImage:
      title: 銃の画像
      type: string
      format: binary

    gunImageUrl:
      title: 銃の画像のURL
      type: string
      format: uri
      example: "https://arsenals/assets/guns/images/G-0001/glock22.png"

    Gun:
      title: 銃
      description: |-
        - id
        - 銃の名称
        - カテゴリー
        - 装弾数
        - 使用する弾丸
      type: object
      properties:
        id:
          $ref: "#/components/schemas/gunId"
        name:
          $ref: "#/components/schemas/gunName"
        category:
          $ref: "#/components/schemas/GunCategory"
        capacity:
          $ref: "#/components/schemas/gunCapacity"
        imageUrl:
          $ref: "#/components/schemas/gunImageUrl"
        bullets:
          type: array
          items:
            $ref: "../bullets/model.yaml#/components/schemas/Bullet"

    gunCategoryId:
      title: 銃カテゴリーID
      type: string
      pattern: '^C-\d{4}$'
      example: "C-0051"

    gunCategoryName:
      title: 銃カテゴリー名
      type: string
      example: "ハンドガン"
      maxLength: 50

    GunCategory:
      title: カテゴリー
      type: object
      properties:
        id:
          $ref: "#/components/schemas/gunCategoryId"
        name:
          $ref: "#/components/schemas/gunCategoryName"
