openapi: 3.0.2
info:
  title: "銃弾モデル"
  version: "1.0"
paths: {}
components:
  schemas:
    bulletName:
      title: 弾丸名
      type: string
      minLength: 1
      maxLength: 50
      example: "9mm"

    bulletId:
      title: 弾丸ID
      type: string
      pattern: "^B-d{4}$"
      example: "B-0003"

    Bullet:
      title: 弾丸
      type: object
      properties:
        id:
          $ref: "#/components/schemas/bulletId"
        name:
          $ref: "#/components/schemas/bulletName"
        damage:
          $ref: "#/components/schemas/Damage"
      required:
        - id
        - name
        - damage

    Damage:
      title: ダメージ
      type: number
      format: int32
      minimum: 1
      example: 12

  parameters:
    bulletId:
      name: "bulletId"
      in: path
      required: true
      schema:
        $ref: "#/components/parameters/bulletId"

    fieldMask:
      name: "fieldMask"
      in: query
      allowEmptyValue: false
      description: |-
        弾丸更新の項目
      required: true
      schema:
        type: string
        enum:
          - "damage"
          - "name"
